name: Update browser engine

# GitHub Pages serves the docs/ folder of main. The page loads the engine from
# docs/xbrl_aoc4.zip; this rebuilds that zip whenever the engine code changes.
on:
  push:
    branches: [main]
    paths: ["xbrl_aoc4/**", "tools/build_web_zip.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_web_zip.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/xbrl_aoc4.zip; then echo "zip up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/xbrl_aoc4.zip
          git commit -m "Rebuild docs/xbrl_aoc4.zip"
          git push
